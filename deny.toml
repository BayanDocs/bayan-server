# cargo-deny configuration (ADR-0017): advisories, licenses, banned crates and allowed sources. `cargo xtask verify` runs `cargo deny --locked --all-features check`, on every pull request and every night. The rules cargo-deny cannot check (exact pins and the 24-hour minimum age of new package versions) are `cargo xtask check-exact-pins` and `cargo xtask check-lockfile-age` (work package X-003).

[graph]
all-features = true

[advisories]
# RustSec advisories: vulnerable and unmaintained crates, and yanked versions, fail the check. Any exception must be listed here with a reason and a review date.
version = 2
yanked = "deny"
# Advisories that a crate is unmaintained or unsound count for every crate in the build, direct or not. For unmaintained crates that is cargo-deny's default; for unsound ones the default would count only the workspace's direct dependencies.
unmaintained = "all"
unsound = "all"
# Exception accepted by the owner on 2026-10-27 (option 1 of the open question in BayanDocs/bayan-server#8), for an advisory whose fix cannot be reached yet: crypto-bigint 0.5.5 has a timing leak that is fixed only in crypto-bigint 0.7.9 and later, which only elliptic-curve 0.14 can use, and the newest releases of the MLS spike's RustCrypto providers (openmls_rust_crypto 0.6.0, mls-rs-crypto-rustcrypto 0.22.1) still need elliptic-curve 0.13. This file is shared by the server and the spike, so the exception also covers the server, which does not depend on crypto-bigint at all today (`cargo tree -i crypto-bigint` finds nothing); a change that brings crypto-bigint into the server must remove the exception first. Review date: every monthly dependency session, starting with November 2026's (the docs repository's developer/dependency-update-runbook.md): the reason must still hold, and the entry goes as soon as those providers move to elliptic-curve 0.14 or the spike is retired.
# Exception for RUSTSEC-2026-0459 (CVE-2026-119375, GHSA-72w2-rjgg-q729), accepted by the owner on 2026-11-12 (option 1 of the security-alert session in BayanDocs/bayan-server#12), for an advisory whose fix cannot be reached yet: SQLite before 3.54.0, which libsqlite3-sys bundles before 0.39.0, can return uninitialized memory when it opens a database together with a crafted write-ahead log (`-wal` file). libsqlite3-sys 0.39.0 and later have the fix, but sqlx-sqlite 0.9.0, the newest sqlx release, accepts only libsqlite3-sys below 0.38.0, so the server stays on 0.37.0 (SQLite 3.51.3). The server opens only its own metadata database (`bayan.sqlite3` in its data directory, `/data` in the container), and none at all when it uses PostgreSQL; in the container only the server's own process can write in `/data`, so planting a crafted `-wal` file takes write access to the data volume, which already allows replacing the database itself; and no value the server reads from the database is sent to clients. spikes/mls/Cargo.lock lists libsqlite3-sys 0.35.0 only through OpenMLS's optional SQLite storage, which no build of the spike compiles, so cargo deny finds the advisory only in the server, and this one entry covers both workspaces. A change that makes the server open any other SQLite file (an import, a restore, a second database) must remove the exception first. Review date: 2026-12-12 at the latest, and every monthly dependency session (the docs repository's developer/dependency-update-runbook.md); the entry goes, and libsqlite3-sys moves to 0.39 or later, as soon as a sqlx release that allows it has been published for at least 24 hours.
ignore = [
  { id = "RUSTSEC-2026-0387", reason = "crypto-bigint 0.5.5 reaches only the MLS spike (spikes/mls), through the RustCrypto providers of OpenMLS and mls-rs, which still need elliptic-curve 0.13; the spike is never built into the server and runs only tests and benchmarks with throwaway keys; the fix needs those providers on elliptic-curve 0.14; re-check in every monthly session, and remove once they move or the spike is retired" },
  { id = "RUSTSEC-2026-0459", reason = "SQLite before 3.54 (libsqlite3-sys before 0.39.0) can leak memory when it opens a database with a crafted -wal file, but the server opens only its own database in its data directory, which in the container only the server itself can write, and never sends a value it reads from it to clients. No sqlx release allows the fix yet (sqlx-sqlite 0.9.0 needs libsqlite3-sys below 0.38.0): review by 2026-12-12, and remove as soon as a sqlx release that allows libsqlite3-sys 0.39 or later has been published for 24 hours" },
]

[licenses]
version = 2
# The allowlist from ADR-0017 §8. A dual-licensed crate qualifies if one option is on the list.
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
]
confidence-threshold = 0.93
# The allowlist is shared by every BayanDocs repository, so entries this workspace does not use yet are expected.
unused-allowed-license = "allow"
# This workspace's own crates are AGPL-3.0-or-later and unpublished; the allowlist applies to dependencies.
private = { ignore = true }

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
# ADR-0006: no C or C++ code beyond SQLite (bundled through libsqlite3-sys, used only for server metadata). `cc` may only be used by libsqlite3-sys; crates that bundle other native code are banned outright, so adding one fails the gate until an ADR amendment allows it.
deny = [
    { crate = "cc", wrappers = ["libsqlite3-sys"], reason = "C code is allowed only for SQLite (ADR-0006 §3)" },
    { crate = "cmake", reason = "no native code beyond SQLite (ADR-0006)" },
    { crate = "bindgen", reason = "no native code beyond SQLite (ADR-0006)" },
    { crate = "openssl-sys", reason = "no native code beyond SQLite (ADR-0006)" },
    { crate = "native-tls", reason = "no native code beyond SQLite (ADR-0006)" },
    # ADR-0028 chose rustls with aws-lc-rs for TLS, so ring stays banned (one crypto provider only).
    { crate = "ring", reason = "not the chosen TLS crypto provider (ADR-0028)" },
    # ADR-0028 allows AWS-LC as rustls's crypto provider. It stays banned until the work package that adds TLS (SRV-102) removes this line, adds aws-lc-sys to the `cc` wrappers above, and adds the webpki-roots license exception (ADR-0017 amendment 2026-10-04), with tests.
    { crate = "aws-lc-sys", reason = "allowed only once TLS is added as ADR-0028 describes" },
    { crate = "libz-sys", reason = "no native code beyond SQLite (ADR-0006)" },
    { crate = "zstd-sys", reason = "no native code beyond SQLite (ADR-0006)" },
    { crate = "bzip2-sys", reason = "no native code beyond SQLite (ADR-0006)" },
    { crate = "lzma-sys", reason = "no native code beyond SQLite (ADR-0006)" },
]

[sources]
# Only crates.io; no Git or alternative registries without an explicit entry here (ADR-0017). A Git dependency needs its repository listed in `allow-git`, with a reason, and must name a fixed `tag` or `rev` (a commit), never a branch; `cargo xtask check-exact-pins` checks the same in the manifests. Cargo.lock records the exact commit either way. `cargo xtask check-lockfile-age`, which runs before anything is built, refuses a Git dependency until a work package teaches it to judge the commit's age.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
required-git-spec = "tag"
