# Clippy configuration (ADR-0006). Lint levels live in [workspace.lints] in Cargo.toml.
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-print-in-tests = true
allow-dbg-in-tests = false
# Project names that are not code; ".." keeps Clippy's built-in list.
doc-valid-idents = ["BayanDocs", "..", "PostgreSQL", "SQLite", "WebSockets"]
