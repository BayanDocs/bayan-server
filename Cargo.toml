[workspace]
resolver = "3"
members = ["crates/bayan-server", "crates/bayan-db-sqlite", "crates/bayan-db-postgres", "xtask"]
default-members = ["crates/bayan-server", "crates/bayan-db-sqlite", "crates/bayan-db-postgres"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "AGPL-3.0-or-later"
repository = "https://github.com/BayanDocs/bayan-server"
publish = false

# ADR-0017: direct dependencies are pinned exactly (`=x.y.z`), every version was at least 24 hours old when pinned, and each one is justified in the pull request that added it. Upgrades happen only in the monthly dependency session.
[workspace.dependencies]
bayan-db-postgres = { path = "crates/bayan-db-postgres" }
bayan-db-sqlite = { path = "crates/bayan-db-sqlite" }
axum = { version = "=0.8.9", default-features = false, features = ["matched-path"] }
# hyper and hyper-util serve the connections directly (crates/bayan-server/src/http/serve.rs) so that every connection gets a timer and a header-read timeout, which `axum::serve` does not set up. Both were already in the build as dependencies of axum; HTTP/1 only.
hyper = { version = "=1.11.1", default-features = false, features = ["http1", "server"] }
hyper-util = { version = "=0.1.21", default-features = false, features = ["http1", "server", "server-graceful", "service", "tokio"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
# SQLite is bundled (compiled from C source by libsqlite3-sys). ADR-0006 §3 permits it because it only stores server-generated metadata through bound parameters; it never parses documents or client-supplied SQL. No TLS feature: every TLS backend sqlx offers needs C or assembly code (ring, aws-lc, OpenSSL), which needs a separate decision.
sqlx = { version = "=0.9.0", default-features = false, features = ["macros", "migrate", "runtime-tokio"] }
thiserror = "=2.0.21"
tokio = { version = "=1.53.2", features = ["macros", "net", "rt-multi-thread", "signal", "time"] }
toml = { version = "=1.1.6", default-features = false, features = ["parse", "serde", "std"] }
tower-http = { version = "=0.7.1", default-features = false, features = ["fs", "limit", "timeout"] }
tracing = { version = "=0.1.44", default-features = false, features = ["std"] }
tracing-subscriber = { version = "=0.3.23", default-features = false, features = ["fmt", "json", "std"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unused_qualifications = "warn"

# Warnings are errors in `cargo xtask verify` (clippy runs with `-D warnings`).
[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
# A curated pedantic subset.
cast_lossless = "warn"
cast_possible_truncation = "warn"
cast_possible_wrap = "warn"
cast_sign_loss = "warn"
checked_conversions = "warn"
doc_markdown = "warn"
explicit_iter_loop = "warn"
manual_let_else = "warn"
needless_pass_by_value = "warn"
redundant_closure_for_method_calls = "warn"
semicolon_if_nothing_returned = "warn"
uninlined_format_args = "warn"
unnested_or_patterns = "warn"
wildcard_imports = "warn"
# Restrictions that matter for a server.
allow_attributes_without_reason = "warn"
dbg_macro = "warn"
print_stderr = "warn"
print_stdout = "warn"
todo = "warn"
undocumented_unsafe_blocks = "warn"
unimplemented = "warn"
unwrap_used = "warn"

[profile.release]
codegen-units = 1
lto = "thin"
# Keep the default `panic = "unwind"`: a panic inside one request task must not abort the whole server.
strip = "symbols"
